<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bali Flight Budget</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .card {
      background: var(--panel);
      border-radius: 1rem;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input, select, button {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .type-toggle {
      display: flex;
      gap: 0.5rem;
    }
    .type-toggle button {
      flex: 1;
      cursor: pointer;
      background: #334155;
      border: none;
      font-weight: 600;
    }
    .type-toggle button.active {
      background: var(--accent);
      color: #0f172a;
    }
    .search-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
    }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .autocomplete {
      position: relative;
    }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      margin-top: 0.25rem;
      max-height: 220px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    .suggestions.open { display: block; }
    .suggestion {
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      border-bottom: 1px solid #334155;
    }
    .suggestion:hover { background: #1e293b; }
    .suggestion small { color: var(--muted); }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid #334155;
    }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .price { font-size: 1.25rem; font-weight: 800; color: var(--accent-2); }
    .book-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .book-link:hover { text-decoration: underline; }
    .empty { color: var(--muted); padding: 1rem 0; }
    .error { color: var(--danger); }
    .spinner {
      display: inline-block;
      width: 1rem; height: 1rem;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
    @media (max-width: 500px) {
      .container { padding: 1rem; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇮🇩 Bali Flight Budget</h1>
    <p class="subtitle">Find the cheapest flights to Denpasar (DPS) from anywhere in Europe.</p>

    <div class="card">
      <div class="grid">
        <div class="autocomplete">
          <label for="origin">Origin city or airport</label>
          <input id="origin" type="text" placeholder="e.g. Helsinki" autocomplete="off">
          <div id="origin-suggestions" class="suggestions"></div>
        </div>

        <div>
          <label for="trip-type">Trip type</label>
          <div class="type-toggle">
            <button id="btn-one" class="active" data-type="one-way">One-way</button>
            <button id="btn-round" data-type="round-trip">Round-trip</button>
          </div>
        </div>

        <div>
          <label for="depart">Departure date</label>
          <input id="depart" type="date">
        </div>

        <div id="return-wrap" style="display:none;">
          <label for="return">Return date</label>
          <input id="return" type="date">
        </div>
      </div>

      <button id="search" class="search-btn">Search cheapest flights</button>
    </div>

    <div class="card" id="results-card" style="display:none;">
      <div class="results-header">
        <h2 id="results-title">Results</h2>
        <span class="meta" id="results-meta"></span>
      </div>
      <div id="results-body">
        <p class="empty">Enter a route and date to see prices.</p>
      </div>
    </div>
  </div>

  <script>
    // CONFIG: point this at your deployed Cloudflare Worker URL.
    const WORKER_URL = "https://bali-budget-worker.YOUR_SUBDOMAIN.workers.dev";

    const originInput = document.getElementById('origin');
    const suggestionsBox = document.getElementById('origin-suggestions');
    const btnOne = document.getElementById('btn-one');
    const btnRound = document.getElementById('btn-round');
    const returnWrap = document.getElementById('return-wrap');
    const returnInput = document.getElementById('return');
    const departInput = document.getElementById('depart');
    const searchBtn = document.getElementById('search');
    const resultsCard = document.getElementById('results-card');
    const resultsBody = document.getElementById('results-body');
    const resultsTitle = document.getElementById('results-title');
    const resultsMeta = document.getElementById('results-meta');

    let selectedOriginCode = null;
    let tripType = 'one-way';

    // Defaults: depart in 30 days, return 7 days later.
    const today = new Date();
    const defaultDepart = new Date(today.setDate(today.getDate() + 30));
    departInput.valueAsDate = defaultDepart;
    const defaultReturn = new Date(defaultDepart);
    defaultReturn.setDate(defaultReturn.getDate() + 7);
    returnInput.valueAsDate = defaultReturn;

    function debounce(fn, ms) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    }

    function setTripType(type) {
      tripType = type;
      if (type === 'round-trip') {
        btnRound.classList.add('active');
        btnOne.classList.remove('active');
        returnWrap.style.display = 'block';
      } else {
        btnOne.classList.add('active');
        btnRound.classList.remove('active');
        returnWrap.style.display = 'none';
      }
    }

    btnOne.addEventListener('click', () => setTripType('one-way'));
    btnRound.addEventListener('click', () => setTripType('round-trip'));

    async function fetchLocations(term) {
      const res = await fetch(`${WORKER_URL}/locations?term=${encodeURIComponent(term)}`);
      if (!res.ok) throw new Error('Location lookup failed');
      return res.json();
    }

    function renderSuggestions(locations) {
      suggestionsBox.innerHTML = '';
      if (!locations || !locations.locations || locations.locations.length === 0) {
        suggestionsBox.classList.remove('open');
        return;
      }
      for (const loc of locations.locations) {
        const div = document.createElement('div');
        div.className = 'suggestion';
        div.innerHTML = `<strong>${loc.name}</strong> <small>(${loc.code}, ${loc.city?.name || ''}, ${loc.country?.name || ''})</small>`;
        div.addEventListener('click', () => {
          originInput.value = `${loc.name} (${loc.code})`;
          selectedOriginCode = loc.code;
          suggestionsBox.classList.remove('open');
        });
        suggestionsBox.appendChild(div);
      }
      suggestionsBox.classList.add('open');
    }

    originInput.addEventListener('input', debounce(async (e) => {
      selectedOriginCode = null;
      const term = e.target.value.trim();
      if (term.length < 2) {
        suggestionsBox.classList.remove('open');
        return;
      }
      try {
        const data = await fetchLocations(term);
        renderSuggestions(data);
      } catch (err) {
        suggestionsBox.classList.remove('open');
      }
    }, 250));

    document.addEventListener('click', (e) => {
      if (!originInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.classList.remove('open');
      }
    });

    function formatDuration(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h}h ${m}m`;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    async function search() {
      if (!selectedOriginCode) {
        resultsBody.innerHTML = '<p class="error">Please select an origin city/airport from the suggestions.</p>';
        resultsCard.style.display = 'block';
        return;
      }
      const depart = departInput.value;
      const ret = returnInput.value;
      if (!depart) {
        resultsBody.innerHTML = '<p class="error">Pick a departure date.</p>';
        resultsCard.style.display = 'block';
        return;
      }
      if (tripType === 'round-trip' && (!ret || ret <= depart)) {
        resultsBody.innerHTML = '<p class="error">Return date must be after departure.</p>';
        resultsCard.style.display = 'block';
        return;
      }

      resultsBody.innerHTML = '<p><span class="spinner"></span>Fetching prices from Kiwi...</p>';
      resultsCard.style.display = 'block';
      resultsTitle.textContent = `${originInput.value.split('(')[0].trim()} → Denpasar`;

      const params = new URLSearchParams({
        origin: selectedOriginCode,
        destination: 'DPS',
        date_from: depart,
        date_to: depart,
        trip_type: tripType,
      });
      if (tripType === 'round-trip') {
        params.set('return_from', ret);
        params.set('return_to', ret);
      }

      try {
        const res = await fetch(`${WORKER_URL}/search?${params.toString()}`);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `Worker returned ${res.status}`);
        }
        renderResults(data);
      } catch (err) {
        resultsBody.innerHTML = `<p class="error">Failed to load prices: ${err.message}</p>`;
      }
    }

    function renderResults(data) {
      const flights = data.data || [];
      if (flights.length === 0) {
        resultsBody.innerHTML = '<p class="empty">No flights found for this route/date. Try a nearby date or airport.</p>';
        return;
      }

      const best = flights[0];
      const bestInfo = document.createElement('div');
      bestInfo.innerHTML = `
        <p style="margin:0 0 1rem;">Cheapest: <span class="price">${Math.round(best.price)} €</span> with ${best.airlines?.join(', ') || 'Multiple airlines'}</p>
      `;

      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th>Price</th>
            <th>Airline(s)</th>
            <th>Route</th>
            <th>Duration</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${flights.map(f => `
            <tr>
              <td class="price">${Math.round(f.price)} €</td>
              <td>${f.airlines?.join(', ') || '-'}</td>
              <td>${f.cityFrom} (${f.flyFrom}) → ${f.cityTo} (${f.flyTo})<br><span class="meta">${formatDate(f.local_departure)}</span></td>
              <td>${formatDuration(f.duration?.total || 0)}</td>
              <td><a class="book-link" href="${f.deep_link}" target="_blank" rel="noopener">Book ↗</a></td>
            </tr>
          `).join('')}
        </tbody>
      `;

      resultsBody.innerHTML = '';
      resultsBody.appendChild(bestInfo);
      resultsBody.appendChild(table);
      resultsMeta.textContent = `${flights.length} option(s) • ${tripType === 'round-trip' ? 'round-trip' : 'one-way'} • via Kiwi.com`;
    }

    searchBtn.addEventListener('click', search);
  </script>
</body>
</html>
